# docker-compose.yml
version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: chamthi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chamthi_db
      MYSQL_USER: chamthi
      MYSQL_PASSWORD: chamthi123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "chamthi", "-pchamthi123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chamthi-api:
    build:
      context: ./chamthi
      dockerfile: Dockerfile
    container_name: chamthi-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chamthi_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: chamthi
      SPRING_DATASOURCE_PASSWORD: chamthi123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate   # Dùng init.sql — không để update
      GRADER_IMAGE_PREFIX: grading-env
      GRADER_MAX_CONCURRENT: 3
      GRADER_TIMEOUT_SECONDS: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - submissions_temp:/tmp/submissions
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  submissions_temp: