spring.application.name=grader

# ============================================================================
#  FEEDBACK BOT (prm393-feedback-bot) — "Đọc & nhận xét bài làm bằng AI"
# ----------------------------------------------------------------------------
#  AI agent FastAPI chạy local (Ollama). Backend gửi result_json của từng SV sang
#  endpoint POST /feedback/generate để sinh lời nhận xét. Chạy bot:
#     uvicorn app.main:app --reload   (trong repo prm393-feedback-bot, mặc định cổng 8000)
#  Override bằng biến môi trường FEEDBACK_API_BASE nếu bot chạy máy/cổng khác.
#  Bot tắt cũng KHÔNG sao — grader vẫn chấm bình thường, trang "Nhận xét AI" sẽ báo.
# ============================================================================
feedback.api.base=${FEEDBACK_API_BASE:http://localhost:8000}
# Model local sinh feedback có thể chậm (CPU) → để timeout rộng cho mỗi bài (giây).
feedback.timeout-seconds=${FEEDBACK_TIMEOUT_SECONDS:600}
# Thư mục data của bot để ĐỒNG BỘ Khung năng lực → bot (BotSyllabusSync ghi skill_mapping.json + 10_*.md).
# Bot là repo RIÊNG sibling; đường dẫn tương đối theo working dir = grader/ (khi chạy mvnw spring-boot:run).
# Bot chạy máy khác thì để trống/không đúng cũng KHÔNG sao — BotSyllabusSync tự bỏ qua êm nếu không thấy.
feedback.bot-data-dir=${FEEDBACK_BOT_DATA_DIR:../../prm393-feedback-bot/data}
