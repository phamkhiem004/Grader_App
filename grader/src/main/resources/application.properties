spring.application.name=grader

# Nạp KEY BÍ MẬT từ file ngoài (đã .gitignore — KHÔNG commit). 'optional:' = thiếu file vẫn chạy.
# Cách dùng khi clone về: copy grader/secret.properties.example -> grader/secret.properties rồi dán key.
# Giá trị trong secret.properties ĐÈ các giá trị bên dưới. Hỗ trợ chạy từ grader/ hoặc gốc repo.
spring.config.import=optional:file:secret.properties,optional:file:grader/secret.properties

# ============================================================================
#  AI EXAM GENERATOR (Tạo đề bằng AI) — CẤU HÌNH (KEY để ở secret.properties, KHÔNG dán vào đây)
# ----------------------------------------------------------------------------
#  Bật tính năng: điền api-key của provider đang chọn rồi khởi động lại backend.
#  - Gemini (Google): key ở https://aistudio.google.com/app/apikey
#  - OpenAI (GPT):    key ở https://platform.openai.com/api-keys
#  Đổi provider chỉ cần sửa grader.ai.provider (gemini | openai).
#  base-url của OpenAI có thể trỏ tới endpoint TƯƠNG THÍCH OpenAI (OpenRouter,
#  Groq, Azure, hoặc model open-source chạy local qua Ollama/vLLM).
# ============================================================================
grader.ai.enabled=true
grader.ai.provider=gemini

# ⚠️ ĐỪNG dán key vào file NÀY (file này được commit lên git → lộ key).
#    Dán key ở grader/secret.properties (đã gitignore). Ở đây để TRỐNG.
grader.ai.gemini.api-key=
grader.ai.gemini.model=gemini-2.0-flash
grader.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

grader.ai.openai.api-key=
grader.ai.openai.model=gpt-4o-mini
grader.ai.openai.base-url=https://api.openai.com/v1
# Chỉ áp dụng cho họ reasoning (gpt-5/o-series): minimal=nhanh nhất (khuyến nghị — backend tự bỏ test fail
# giữ phần PASS nên vẫn đạt nhiều test); low/medium/high=kỹ hơn nhưng chậm hơn.
grader.ai.openai.reasoning-effort=minimal

# Vòng compile-fix: số lần tối đa AI tự sửa khi testcase chưa biên dịch/PASS
grader.ai.max-fix-attempts=4
# Reasoning (gpt-5/o-series) chậm hơn nhiều → để timeout rộng cho mỗi lần gọi.
grader.ai.timeout-seconds=300
grader.ai.compile-timeout-seconds=150

# Tốc độ compile-check: dùng container ẤM dùng chung + CPU/RAM cao hơn lúc chấm để biên dịch nhanh.
grader.ai.compile-cpus=4.0
grader.ai.compile-memory=3072m

# Sinh testcase THEO LÔ (pha A): lô NỀN sinh đầy đủ; các lô sau chỉ trả PHẦN MỚI (delta) rồi backend GHÉP
# vào (không in lại test cũ) → mỗi lần gọi AI ngắn, nhanh, không bị cắt do giới hạn token.
# batch-size = số testcase thêm mỗi lô; max-batch-rounds = trần tổng số vòng pha A (nền + sửa + thêm lô).
# Lô TO hơn → ít vòng gọi AI hơn → NHANH hơn (gpt-5 đủ giỏi để lô lớn vẫn "dính"; lô delta nhỏ nên không cụt token).
grader.ai.batch-size=20
grader.ai.max-batch-rounds=12

# Số testcase: để AI tự quyết "nhiều nhất có thể". min-testcases là SÀN; auto-target là mục tiêu khi chọn "Tự động"
# (đặt ~80 = tối đa). Nhập tay sẽ bị kẹp [min, 80].
grader.ai.min-testcases=30
grader.ai.auto-target=80
# base-size: cỡ lô nền NHỎ để hội tụ (PASS hết) nhanh; phần còn lại bù bằng các lô delta (batch-size).
grader.ai.base-size=16

# allow-widget-tests=true: ưu tiên sinh widget test vì đề Flutter của hệ thống tập trung chấm UI/hành vi màn hình.
# Nếu cần tạo đề logic-only thật nhanh thì có thể override GRADER_AI_ALLOW_WIDGET_TESTS=false hoặc sửa dòng này.
grader.ai.allow-widget-tests=true
