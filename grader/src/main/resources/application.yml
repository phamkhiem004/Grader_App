spring:

  application:
    name: grader
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chamthi_db?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:chamthi}
    password: ${SPRING_DATASOURCE_PASSWORD:chamthi123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB



grader:
  image:
    prefix: ${GRADER_IMAGE_PREFIX:grading-env}
  max:
    concurrent: ${GRADER_MAX_CONCURRENT:8}
  timeout:
    seconds: ${GRADER_TIMEOUT_SECONDS:120}
